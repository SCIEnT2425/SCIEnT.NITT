# Secrets live in ./server/.env (see server/.env.example), read on the server only.
# The database is the local "db" container (MongoDB), not Atlas: the backend's
# MONGO_URI is set below and overrides any Atlas URI left in server/.env.
# deploy_script.sh starts db, seeds it, then starts backend and frontend.
#
# Pinned project name keeps the db-data volume the same whatever the folder is called.
name: scient

services:
  db:
    # deploy_script.sh writes MONGO_IMAGE=mongo:4.4 to ./.env on CPUs without AVX
    image: ${MONGO_IMAGE:-mongo:7.0}
    restart: unless-stopped
    volumes:
      - db-data:/data/db
    # No published port: only containers on scient-network can reach it
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - scient-network

  frontend:
    build:
      context: ./
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - scient-network

  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://db:27017/scient
      - MONGO_URI_ATLAS=
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scient-network

volumes:
  db-data:

networks:
  scient-network:
    external: true
